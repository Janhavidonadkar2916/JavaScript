<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Information Extractor</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container{
            width: 600px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2{
            text-align: center;
            color: #007BFF;
        }

        p{
            color: #555;
        }

        textarea{
            width: 100%;
            height: 180px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            resize: none;
        }

        button{
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            background: #0056b3;
        }

        #output{
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 5px solid #007BFF;
            line-height: 1.8;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Student Information Extractor</h2>

    <p>
        Enter a paragraph containing student details such as
        name, roll number, email, phone number and department.
    </p>

    <textarea id="text"
    placeholder="Enter paragraph here..."></textarea>

    <button onclick="analyzeText()">
        Extract and Analyze
    </button>

    <div id="output">
        Result will appear here.
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
