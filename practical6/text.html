<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>String and Regex Operations</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:500px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            color:#007BFF;
            margin-bottom:25px;
        }

        label{
            display:block;
            font-weight:bold;
            margin-bottom:8px;
        }

        textarea{
            width:100%;
            height:120px;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            resize:none;
            font-size:15px;
            outline:none;
        }

        textarea:focus{
            border-color:#007BFF;
        }

        select{
            width:100%;
            padding:11px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        #result{
            margin-top:20px;
            padding:15px;
            background:#f8f9fa;
            border-left:5px solid #007BFF;
            border-radius:8px;
            line-height:1.8;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>String & Regex Operations</h2>

    <label>Enter Text / Email</label>

    <textarea
        id="inputText"
        placeholder="Enter your text here...">
    </textarea>

    <label>Select Operation</label>

    <select id="operation">

        <option value="email">
            Email Validation
        </option>

        <option value="extract">
            Data Extraction
        </option>

        <option value="vowel">
            Vowel Detection
        </option>

        <option value="analysis">
            Text Analysis
        </option>

        <option value="reverse">
    Reverse String
</option>

    </select>

    <button onclick="performOperation()">
        Perform Operation
    </button>

    <div id="result">
        Result will appear here.
    </div>

</div>

<script src="script.js"></script>

</body>

</html>
