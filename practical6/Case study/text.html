<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>String Operations</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 450px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 12px gray;
        }

        h2 {
            text-align: center;
            color: #007BFF;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            font-size: 15px;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 15px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 5px solid #007BFF;
            border-radius: 6px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>String Operations</h2>

    <label>Enter String / Paragraph</label>

    <textarea id="text"
        placeholder="Enter your string or paragraph here..."></textarea>

    <label>Select Operation</label>

    <select id="operation">

        <option value="reverse">
            Reverse String
        </option>

        <option value="vowels">
            Count Vowels
        </option>

    </select>

    <button onclick="performOperation()">
        Perform Operation
    </button>

    <div id="result">
        Result will appear here.
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
