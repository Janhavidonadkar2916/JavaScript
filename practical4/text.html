<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Palindrome Checker</title>

    <style>

     *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#74ebd5,#9face6);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
    transition:0.3s;
}

.container:hover{
    transform:translateY(-5px);
}

h2{
    text-align:center;
    color:#1565c0;
    margin-bottom:25px;
    font-size:28px;
}

label{
    font-weight:600;
    color:#333;
    display:block;
    margin-bottom:8px;
}

input[type="text"]{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;
    transition:0.3s;
}

input[type="text"]:focus{
    border-color:#1565c0;
    box-shadow:0 0 8px rgba(21,101,192,0.3);
}

input[type="button"]{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1565c0;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

input[type="button"]:hover{
    background:#0d47a1;
    transform:scale(1.03);
}

#result{
    margin-top:25px;
    padding:15px;
    text-align:center;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    background:#f4f8ff;
    border-left:6px solid #1565c0;
}

    </style>

</head>

<body>

<div class="container">

<h2>Palindrome Checker</h2>

<label>Enter a String</label>

<input
type="text"
id="text"
placeholder="Enter text">

<input
type="button"
value="Check Palindrome"
onclick="checkPalindrome()">

<p id="result"></p>

</div>

<script src="script.js"></script>

</body>

</html>
