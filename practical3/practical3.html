<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Student Grading System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
background:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#007BFF;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    margin-top:12px;
    display:block;
}

input[type=text],
input[type=number]{

    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
}

input:focus{

    border-color:#007BFF;

}

input[type=button]{

    width:100%;
    margin-top:20px;
    padding:12px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

input[type=button]:hover{

    background:#0056b3;

}

.result{

    margin-top:25px;
    background:#f7f9fc;
    border-left:5px solid #007BFF;
    padding:18px;
    border-radius:8px;
}

.result h3{

    color:#007BFF;
    margin-bottom:10px;
}

.result p{

    font-size:17px;
    margin:8px 0;
}

span{

    font-weight:bold;
    color:#e91e63;
}

</style>

</head>

<body>

<div class="container">

<h2> Student Grading System</h2>

<label>Student Name</label>
<input type="text" id="name">

<label>CC</label>
<input type="number" id="eng">

<label>CN</label>
<input type="number" id="math">

<label>DC</label>
<input type="number" id="science">

<label>JS</label>
<input type="number" id="computer">

<label>Flexi</label>
<input type="number" id="social">

<input type="button"
value="Calculate Result"
onclick="calculateResult()">

<div class="result">

<h3>Result</h3>

<p>Total Marks : <span id="total">0</span></p>

<p>Percentage : <span id="percentage">0%</span></p>

<p>Grade : <span id="grade">-</span></p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
