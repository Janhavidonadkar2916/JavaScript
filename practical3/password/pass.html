<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Student Login Page</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef4ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
    color:#0d6efd;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:6px;
    margin-top:12px;
    font-weight:bold;
    color:#333;
}

input[type=text],
input[type=password]{

    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    font-size:15px;
    transition:.3s;
    margin-bottom:10px;

}

input[type=text]:focus,
input[type=password]:focus{

    border-color:#0d6efd;
    box-shadow:0 0 5px rgba(13,110,253,.3);

}

input[type=checkbox]{

    margin-right:6px;
    cursor:pointer;

}

.rules{

    margin-top:15px;
    background:#f8f9fa;
    padding:12px;
    border-left:5px solid #0d6efd;
    border-radius:8px;
    font-size:14px;
    color:#444;

}

.rules ul{

    margin-top:8px;
    padding-left:20px;

}

input[type=button]{

    width:100%;
    margin-top:20px;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;

}

input[type=button]:hover{

    background:#0b5ed7;

}

#message{

    margin-top:20px;
    text-align:center;
    font-size:17px;
    font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h2> Student Login</h2>

<label>Student ID</label>

<input type="text"
id="studentid"
placeholder="Enter Student ID">

<label>Student Name</label>

<input type="text"
id="username"
placeholder="Enter Student Name">

<label>Password</label>

<input type="password"
id="password"
placeholder="Enter Password">

<input type="checkbox"
onclick="showPassword()">

Show Password

<div class="rules">

<b>Password must contain:</b>

<ul>

<li>Minimum 8 characters</li>

<li>At least 1 uppercase letter</li>

<li>At least 1 lowercase letter</li>

<li>At least 1 number</li>

<li>At least 1 special character (@,#,$,%,&,*)</li>

</ul>

</div>

<input
type="button"
value="Login"
onclick="login()">

<p id="message"></p>

</div>

<script src="script.js"></script>

</body>

</html>
