<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 450px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 12px gray;
        }

        h2 {
            text-align: center;
            color: #007BFF;
            margin-bottom: 20px;
        }

        .input-section {
            display: flex;
            gap: 10px;
        }

        #taskInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        #addButton {
            padding: 10px 15px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #addButton:hover {
            background: #0056b3;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f5f5f5;
            padding: 12px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .task-text {
            flex: 1;
        }

        .edit-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 7px 10px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 7px 10px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .edit-btn:hover {
            background: #1e7e34;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2> My To-Do List</h2>

        <div class="input-section">

            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter a new task">

            <button id="addButton" onclick="addTask()">
                Add
            </button>

        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
