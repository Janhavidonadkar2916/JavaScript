<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Student Registration Form</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 550px;
            padding: 30px;
            border: 1px solid #999;
            border-radius: 5px;
            background: white;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .mandatory {
            color: darkred;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .row {
            margin-bottom: 12px;
        }

        label {
            display: inline-block;
            width: 130px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="url"],
        input[type="password"] {
            width: 270px;
            padding: 8px;
            border: 1px solid #777;
        }

        select {
            padding: 8px;
            width: 85px;
        }

        #month {
            width: 100px;
        }

        #year {
            width: 90px;
        }

        .terms {
            margin-left: 130px;
            margin-top: 15px;
        }

        button {
            margin-left: 130px;
            margin-top: 20px;
            padding: 10px 25px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #message {
            margin-top: 15px;
            margin-left: 130px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .focus {
            background-color: #eef6ff;
        }

    </style>

</head>


<body>

<div class="container">

    <h2>Student Registration Form</h2>

    <div class="mandatory">
        * Mandatory to fill
    </div>


    <form id="registrationForm">


        <!-- First Name -->

        <div class="row">

            <label>Firstname: *</label>

            <input
                type="text"
                id="firstname"
                placeholder="Enter First Name"
                required>

        </div>


        <!-- Last Name -->

        <div class="row">

            <label>Lastname:</label>

            <input
                type="text"
                id="lastname"
                placeholder="Enter Last Name">

        </div>


        <!-- Birthday -->

        <div class="row">

            <label>Birthday:</label>

            <select id="day">

                <option value="">Day</option>

                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
                <option>14</option>
                <option>15</option>
                <option>16</option>
                <option>17</option>
                <option>18</option>
                <option>19</option>
                <option>20</option>
                <option>21</option>
                <option>22</option>
                <option>23</option>
                <option>24</option>
                <option>25</option>
                <option>26</option>
                <option>27</option>
                <option>28</option>
                <option>29</option>
                <option>30</option>
                <option>31</option>

            </select>


            <select id="month">

                <option value="">Month</option>

                <option>January</option>
                <option>February</option>
                <option>March</option>
                <option>April</option>
                <option>May</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
                <option>December</option>

            </select>


            <select id="year">

                <option value="">Year</option>

                <option>2000</option>
                <option>2001</option>
                <option>2002</option>
                <option>2003</option>
                <option>2004</option>
                <option>2005</option>
                <option>2006</option>
                <option>2007</option>
                <option>2008</option>
                <option>2009</option>
                <option>2010</option>

            </select>

        </div>


        <!-- Username -->

        <div class="row">

            <label>Username: *</label>

            <input
                type="text"
                id="username"
                placeholder="Enter Username"
                required>

        </div>


        <!-- Email -->

        <div class="row">

            <label>E-mail:</label>

            <input
                type="email"
                id="email"
                placeholder="Enter Email">

        </div>


        <!-- Website -->

        <div class="row">

            <label>Website:</label>

            <input
                type="url"
                id="website"
                placeholder="https://example.com">

        </div>


        <!-- Password -->

        <div class="row">

            <label>Password: *</label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required>

        </div>


        <!-- Re-password -->

        <div class="row">

            <label>Re-password: *</label>

            <input
                type="password"
                id="repassword"
                placeholder="Confirm Password"
                required>

        </div>


        <!-- Terms -->

        <div class="terms">

            <input
                type="checkbox"
                id="terms">

            I agree to the terms & conditions.

        </div>


        <!-- Submit -->

        <button type="submit">
            Register
        </button>


        <div id="message"></div>


    </form>

</div>


<script src="script.js"></script>

</body>

</html>
