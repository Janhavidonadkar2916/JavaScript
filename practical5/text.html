<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Shopping Cart Calculator</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{

    width:420px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px gray;

}

h2{

    text-align:center;
    color:#007BFF;
    margin-bottom:20px;

}

label{

    font-weight:bold;

}

select,input{

    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;

}

button{

    width:100%;
    padding:10px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;

}

button:hover{

    background:#0056b3;

}

#output{

    margin-top:20px;
    font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h2>Shopping Cart Calculator</h2>

<label>Product</label>

<select id="product">

<option value="500">Laptop Bag - ₹500</option>

<option value="300">Keyboard - ₹300</option>

<option value="200">Mouse - ₹200</option>

<option value="150">Pendrive - ₹150</option>

<option value="1800">Backpack - ₹1,800</option>

    <option value="4500">Headphones - ₹4,500</option>

    <option value="6000">Smart Watch - ₹6,000</option>

    <option value="1500">Pendrive (64GB) - ₹1,500</option>

    <option value="3200">External Hard Disk - ₹3,200</option>

    <option value="850">USB Cable - ₹850</option>

    <option value="950">Mobile Charger - ₹950</option>

    <option value="12000">Printer - ₹12,000</option>

</select>

<label>Quantity</label>

<input
type="number"
id="quantity"
value="1"
min="1">

<label>Discount (%)</label>

<input
type="number"
id="discount"
value="10">

<button onclick="addToCart()">

Add to Cart

</button>

<br><br>

<button onclick="calculateTotal()">

Calculate Total

</button>

<div id="output"></div>

</div>

<script src="script.js"></script>

</body>

</html>
